<nav class="navbar">
  <div class="navbar-brand">
    <mat-icon class="brand-icon">account_balance_wallet</mat-icon>
    <span class="brand-text">ExpenseTracker</span>
  </div>
  <div class="navbar-actions">
    <div class="user-info">
      <div class="user-avatar">{{ user?.username?.charAt(0)?.toUpperCase() || 'U' }}</div>
      <div class="user-details">
        <span class="user-name">{{ user?.username || 'User' }}</span>
        <span class="user-email">{{ user?.email || '' }}</span>
      </div>
    </div>
    <button mat-icon-button class="logout-btn" (click)="logout()" matTooltip="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</nav>
